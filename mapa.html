  map = new mapboxgl.Map({
    container: 'map',
    style: 'mapbox://styles/mapbox/dark-v11',
    center: [22.605, 51.4605],
    zoom: 13.5,
    pitch: 15
  });

  map.on('error', (e) => {
    console.error('Błąd Mapbox (prawdopodobnie zły/wygasły token):', e);
    document.getElementById('tokenGate').classList.add('visible');
  });

  map.on('load', () => {
    points.forEach(p => addMarker(p, false));
    wyprawy.forEach(p => addMarker(p, true));
    buildPanel();
    buildLegend();
    drawNarrativeRoute();
  });
}

function startMapWithInputToken() {
  const val = document.getElementById('tokenInput').value.trim();
  if (!val) return;
  document.getElementById('tokenGate').classList.remove('visible');
  initMap(val);
}

function addMarker(p, isWyprawa) {
  const el = document.createElement('div');
  const shape = TYPES[p.type] ? TYPES[p.type].shape : 'round';
  el.className = `marker shape-${shape}`;
  el.style.background = ERAS[p.era] ? ERAS[p.era].color : '#888';
  el.dataset.era = p.era;
  el.dataset.type = p.type;

  const numberSpan = document.createElement('span');
  numberSpan.className = 'marker-number';
  numberSpan.innerText = isWyprawa ? '🚗' : (p.order_route || '');
  el.appendChild(numberSpan);

  const distanceNote = isWyprawa
    ? `<div class="audio">📍 Poza trasą pieszą — wymaga dojazdu</div>` : '';
  const audioLine = p.audio ? `<div class="audio">🔊 ${p.audio}</div>` : '';

  const popup = new mapboxgl.Popup({ offset: 14 }).setHTML(`
    <span class="meta">${p.era} · ${p.type_szczegol || p.type}</span>
    <h3>${p.name}</h3>
    ${p.addr ? `<p style="font-size:11px; color:#8a7a5c; margin:0 0 6px 0;">📍 ${p.addr}</p>` : ''}
    ${p.desc ? `<p>${p.desc}</p>` : '<p style="font-style:italic; color:#9a8a6a;">Opis w przygotowaniu.</p>'}
    ${audioLine}
    ${distanceNote}
  `);

  const marker = new mapboxgl.Marker(el).setLngLat(p.coords).setPopup(popup).addTo(map);
  markerObjects.push({ marker, era: p.era, type: p.type, el });
}

function buildPanel() {
  const panel = document.createElement('div');
  panel.id = 'panel';
  panel.innerHTML = `
    <h1>Lubartowski Szlak Pamięci</h1>
    <p><span class="count">${points.length}</span> punktów docelowych w mieście + <span class="count">${wyprawy.length}</span> wyjazdowe.</p>
    <p><a href="https://szlakpamieci.netlify.app/" target="_blank">🏰 Bastion Pamięci — pełne archiwum →</a></p>
  `;
  document.body.appendChild(panel);
}

function buildLegend() {
  const legend = document.createElement('div');
  legend.id = 'legend';
  let html = `<div class="legend-group-title">Era</div>`;
  Object.entries(ERAS).forEach(([key, val]) => {
    html += `
      <label>
        <input type="checkbox" checked onchange="applyFilters()" data-filter="era" value="${key}">
        <span class="swatch round" style="background:${val.color}"></span>
        ${key}
      </label>`;
  });
  html += `<div class="legend-group-title">Typ obiektu</div>`;
  Object.entries(TYPES).forEach(([key, val]) => {
    html += `
      <label>
        <input type="checkbox" checked onchange="applyFilters()" data-filter="type" value="${key}">
        <span class="swatch ${val.shape}" style="background:#999"></span>
        ${key}
      </label>`;
  });
  legend.innerHTML = html;
  document.body.appendChild(legend);
}

function applyFilters() {
  const eraChecked = [...document.querySelectorAll('input[data-filter="era"]:checked')].map(i => i.value);
  const typeChecked = [...document.querySelectorAll('input[data-filter="type"]:checked')].map(i => i.value);
  markerObjects.forEach(m => {
    const visible = eraChecked.includes(m.era) && typeChecked.includes(m.type);
    m.el.style.display = visible ? 'flex' : 'none';
  });
}

/* ======================================================================
   RYSOWANIE ŻÓŁTEJ LINII — sortowanie po order_route (nie po id!),
   żeby trasa nie gubiła ciągłości i przechodziła logiczną pętlą po mieście.
   ====================================================================== */
async function drawNarrativeRoute() {
  const ordered = [...points].sort((a, b) => a.order_route - b.order_route);
  const coords = ordered.map(p => p.coords);

  try {
    // Directions API: max 25 współrzędnych/zapytanie — 26 punktów dzielimy
    // na dwa zachodzące na siebie odcinki i sklejamy geometrię w jedną linię.
    const chunk1 = coords.slice(0, 25);
    const chunk2 = coords.slice(24);
    const [geo1, geo2] = await Promise.all([fetchRouteChunk(chunk1), fetchRouteChunk(chunk2)]);

    let mergedCoords, totalDistance = 0, totalDuration = 0;
    if (geo1 || geo2) {
      mergedCoords = [
        ...(geo1 ? geo1.geometry.coordinates : []),
        ...(geo2 ? geo2.geometry.coordinates.slice(1) : [])
      ];
      totalDistance = (geo1 ? geo1.distance : 0) + (geo2 ? geo2.distance : 0);
      totalDuration = (geo1 ? geo1.duration : 0) + (geo2 ? geo2.duration : 0);
    } else {
      // Fallback: jeśli Directions API zawiedzie, rysujemy linię prostą po order_route,
      // żeby trasa nigdy nie "znikała" całkowicie.
      console.warn('Directions API niedostępne — rysuję linię prostą wg order_route.');
      mergedCoords = coords;
    }

    const geojson = { type: 'Feature', geometry: { type: 'LineString', coordinates: mergedCoords } };
    map.addSource('route', { type: 'geojson', data: geojson });
    map.addLayer({
      id: 'route-casing', type: 'line', source: 'route',
      layout: { 'line-cap': 'round', 'line-join': 'round' },
      paint: { 'line-color': '#14120f', 'line-width': 6, 'line-opacity': 0.6 }
    });
    map.addLayer({
      id: 'route-line', type: 'line', source: 'route',
      layout: { 'line-cap': 'round', 'line-join': 'round' },
      paint: { 'line-color': '#d8b878', 'line-width': 3, 'line-dasharray': [0.2, 1.6] }
    });

    const info = document.createElement('div');
    info.id = 'routeInfo';
    if (totalDistance > 0) {
      const km = (totalDistance / 1000).toFixed(1);
      const min = Math.round(totalDuration / 60);
      info.innerHTML = `🚶 Trasa piesza (${points.length} pkt, tryb narracyjny): <strong>${km} km</strong> · ok. <strong>${min} min</strong>`;
    } else {
      info.innerHTML = `🚶 Trasa piesza (${points.length} pkt) — linia orientacyjna, Directions API niedostępne.`;
    }
    document.body.appendChild(info);

  } catch (err) {
    console.error('Błąd rysowania trasy:', err);
  }
}

async function fetchRouteChunk(coordsArray) {
  if (coordsArray.length < 2) return null;
  const coordsStr = coordsArray.map(c => c.join(',')).join(';');
  const url = `https://api.mapbox.com/directions/v5/mapbox/walking/${coordsStr}` +
    `?geometries=geojson&overview=full&access_token=${mapboxgl.accessToken}`;
  const res = await fetch(url);
  const data = await res.json();
  if (!data.routes || !data.routes.length) return null;
  return data.routes[0];
}

// Start mapy z wbudowanym tokenem. Jeśli token zawiedzie, map.on('error', ...)
// powyżej automatycznie pokaże panel do wpisania własnego tokenu.
initMap(DEFAULT_TOKEN);
</script>

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
</script>
