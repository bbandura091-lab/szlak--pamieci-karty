    padding: 14px 16px; font-family: Arial, sans-serif; font-size: 12px;

  .mapboxgl-popup-content p { margin: 0 0 8px 0; font-size: 13px; line-height: 1.5; }

  }
  .marker.shape-round { border-radius: 50%; }
  .marker.shape-diamond { border-radius: 3px; transform: rotate(45deg); }
  .marker.shape-square { border-radius: 2px; }
  .marker-number {

  #routeInfo {
    position: absolute; bottom: 16px; right: 16px; z-index: 5;

  }
  #routeInfo strong { color: #f4e9d8; }
</style>

<script>

   TAKSONOMIA: dwa niezależne parametry filtrowania na punkt

   - type: rodzaj obiektu
   ====================================================================== */

/* ======================================================================
   26 PUNKTÓW DOCELOWYCH — baza miejska
   POPRAWKI WZGLĘDEM ORYGINAŁU (zob. wiadomość w czacie z pełną listą):

      zestaw (id 5,6,7,8) z poprawnymi, nienachodzącymi się współrzędnymi.
   2. Naprawiono odwrócone współrzędne [lat,lng] -> [lng,lat] przy
      "Miejsce Męczeństwa".
   3. Naprawiono brakujący przecinek w [lng lat] przy dawnym duplikacie
      "Kwatera Wrześniowa 1939" (ten wpis usunięty jako duplikat).
   4. Wszystkie ID są teraz unikalne w obrębie tablicy `points`.
   order_route = kolejność w pętli spacerowej (wyliczona geograficznie,
   nie wg numeracji ID), używana WYŁĄCZNIE do rysowania żółtej linii.
   ====================================================================== */
const points = [
  { id: 1, order_route: 1, name: "Sztab Marszałka Piłsudskiego (1920)", era: "WOJNA 1920", type: "OBIEKT HISTORYCZNY / ARCHITEKTURA", coords: [22.60789, 51.46234], addr: "Rynek II / Gmach Starostwa", desc: "17 sierpnia 1920 r. w gmachu starostwa odbyła się narada z udziałem Józefa Piłsudskiego, gdzie kwaterował dowódca Frontu Środkowego gen. Rydz-Śmigły. Stąd wyszły plany kontrofensywy znad Wieprza. [Źródło: kalendarium Muzeum Ziemi Lubartowskiej — data i miejsce skorygowane względem wcześniejszej wersji „15-16 sierpnia, Rynek II”]", audio: "audio_sztab_pilsudskiego.mp3" },
  { id: 2, order_route: 2, name: "Magazyn Uzbrojenia Kedywu", era: "II WOJNA ŚWIATOWA", type: "OBIEKT HISTORYCZNY / ARCHITEKTURA", coords: [22.60760, 51.46280], addr: "Rynek", desc: "Zakonspirowany punkt dystrybucji granatów 'filipinek' oraz broni maszynowej ze zrzutów.", audio: "audio_magazyn_kedywu.mp3" },
  { id: 3, order_route: 3, name: "Magistrat (Legalizacja AK)", era: "II WOJNA ŚWIATOWA", type: "OBIEKT HISTORYCZNY / ARCHITEKTURA", coords: [22.60740, 51.46380], addr: "Rynek", desc: "Wydział fałszowania tożsamości. Urzędnicy podziemia masowo wystawiali tu lewe kennkarty.", audio: "audio_magistrat_legalizacja.mp3" },
  { id: 4, order_route: 4, name: "Plac Wolności — Rejon Mobilizacji", era: "II WOJNA ŚWIATOWA", type: "MIEJSCE PAMIĘCI / POMNIK", coords: [22.60810, 51.46410], addr: "Plac Wolności", desc: "Miejsce koncentracji oddziałów miejskich AK tuż przed jawnym wystąpieniem zbrojnym.", audio: "audio_plac_mobilizacji.mp3" },
  { id: 9, order_route: 5, name: "Bitwa pod Lubartowem 1831", era: "POWSTANIA", type: "MIEJSCE PAMIĘCI / POMNIK", coords: [22.60890, 51.46450], addr: "ul. Mickiewicza", desc: "Starcie korpusu gen. Wojciecha Chrzanowskiego z oddziałami rosyjskimi. Wojsku polskiemu udało się wycofać — punktem oporu osłaniającym odwrót był klasztor Kapucynów, gdzie obroną dowodził kpt. Józef Leśniowski. [Skorygowano: to była osłona odwrotu, nie „zwycięskie starcie”; dokładna data dzienna niepotwierdzona]", audio: "audio_bitwa_1831.mp3" },
  { id: 10, order_route: 6, name: "Miejsce Męczeństwa", era: "PODZIEMIE ANTYKOMUNISTYCZNE", type: "MIEJSCE PAMIĘCI / POMNIK", coords: [22.59320, 51.45950], addr: "ul. Lubelska", desc: "Dawne miejsce martyrologii i aresztu. Upamiętnienie ofiar systemu totalitarnego na Ziemi Lubartowskiej.", audio: "audio_miejsce_meczenstwa.mp3" },
  { id: 11, order_route: 7, name: "Dawny Szpital Powiatowy (Tajna Służba Medyczna)", era: "II WOJNA ŚWIATOWA", type: "OBIEKT HISTORYCZNY / ARCHITEKTURA", coords: [22.59250, 51.46330], addr: "róg ul. Lipowej i Słowackiego (obecnie PMDK)", desc: "Konspiracyjny punkt leczniczy i sanitarny Obwodu ZWZ-AK. W podziemiach i na oddziałach udzielano pomocy rannym partyzantom oraz zabezpieczano leki i materiały opatrunkowe.", audio: "audio_szpital_medycyna.mp3" },
  { id: 12, order_route: 8, name: "Sąd Grodzki (Komórka Kontrwywiadu)", era: "II WOJNA ŚWIATOWA", type: "OBIEKT HISTORYCZNY / ARCHITEKTURA", coords: [22.60680, 51.46210], addr: "Słowackiego", desc: "Legalne zaplecze sądownicze wykorzystywane do niszczenia kartotek i spowalniania śledztw.", audio: "audio_sad_kontrwywiad.mp3" },
  { id: 13, order_route: 9, name: "Kościół św. Anny — Oparcie Konspiracji", era: "II WOJNA ŚWIATOWA", type: "OBIEKT HISTORYCZNY / ARCHITEKTURA", coords: [22.60750, 51.46080], addr: "Słowackiego", desc: "Ośrodek wsparcia duchowego i materialnego dla rodzin aresztowanych oraz miejsce tajnego nauczania.", audio: "audio_kosciol_sw_anny_opor.mp3" },
  { id: 14, order_route: 10, name: "Kino 'Echo' — Sabotaż Szarych Szeregów", era: "II WOJNA ŚWIATOWA", type: "OBIEKT HISTORYCZNY / ARCHITEKTURA", coords: [22.60650, 51.46150], addr: "Lubelska", desc: "Teren akcji ulotkowych i gazowych wymierzonych w propagandowe seanse kinowe okupanta.", audio: "audio_kino_echo_sabotaz.mp3" },
  { id: 15, order_route: 11, name: "Gimnazjum i Liceum (Tajne Komplety)", era: "II WOJNA ŚWIATOWA", type: "OBIEKT HISTORYCZNY / ARCHITEKTURA", coords: [22.60680, 51.46290], addr: "Lubelska", desc: "Kuźnia kadr Polskiego Państwa Podziemnego. Miejsce tajnej edukacji młodzieży w warunkach okupacyjnych.", audio: "audio_tajne_komplety.mp3" },
  { id: 16, order_route: 12, name: "Stara Poczta (Komórka Przechwytu)", era: "II WOJNA ŚWIATOWA", type: "OBIEKT HISTORYCZNY / ARCHITEKTURA", coords: [22.60850, 51.46320], addr: "Lubelska", desc: "Przechwytywanie listów donosowych do władz niemieckich. Kluczowe ogniwo wczesnego ostrzegania.", audio: "audio_stara_poczta.mp3" },
  { id: 17, order_route: 13, name: "Klasztor OO. Kapucynów (Punkt Kontaktowy)", era: "II WOJNA ŚWIATOWA", type: "OBIEKT HISTORYCZNY / ARCHITEKTURA", coords: [22.61050, 51.46380], addr: "Lubelska", desc: "Zakonspirowana baza kurierska Obwodu AK, schronienie dla ściganych oficerów podziemia.", audio: "audio_klasztor_kapucynow.mp3" },
  { id: 18, order_route: 14, name: "Rampa Deportacyjna (Torowisko)", era: "II WOJNA ŚWIATOWA", type: "MIEJSCE PAMIĘCI / POMNIK", coords: [22.60280, 51.46350], addr: "Kolejowa", desc: "Miejsce koncentracji i masowych wywózek mieszkańców do obozów koncentracyjnych i zagłady.", audio: "audio_rampa_deportacyjna.mp3" },
  { id: 19, order_route: 15, name: "Dworzec PKP — Wywiad Kolejowy", era: "II WOJNA ŚWIATOWA", type: "OBIEKT HISTORYCZNY / ARCHITEKTURA", coords: [22.60310, 51.46290], addr: "Kolejowa", desc: "Punkt obserwacyjny wywiadu AK monitorujący transporty Wehrmachtu na linii Lublin-Siedlce.", audio: "audio_dworzec_wywiad.mp3" },
  { id: 20, order_route: 16, name: "Obrona Węzła Kolejowego 1920", era: "WOJNA 1920", type: "MIEJSCE PAMIĘCI / POMNIK", coords: [22.60810, 51.46180], addr: "ul. Kolejowa", desc: "Walki o tory i łączność armii prowadzone przez 21. Dywizję Piechoty Górskiej w sierpniu 1920 roku.", audio: "audio_obrona_kolei.mp3" },
  { id: 21, order_route: 17, name: "Dawna Elektrownia Miejska", era: "II WOJNA ŚWIATOWA", type: "OBIEKT HISTORYCZNY / ARCHITEKTURA", coords: [22.60420, 51.46190], addr: "1 Maja", desc: "Miejsce sabotażu technicznego robotników zrzeszonych w strukturach ruchu oporu.", audio: "audio_elektrownia.mp3" },
  { id: 22, order_route: 18, name: "Biblioteka Macierzy Szkolnej", era: "II WOJNA ŚWIATOWA", type: "OBIEKT HISTORYCZNY / ARCHITEKTURA", coords: [22.60590, 51.46020], addr: "Kościuszki", desc: "Legalnie działająca czytelnia będąca w rzeczywistości centralną skrzynką kontaktową Obwodu.", audio: "audio_macierz_szkolna.mp3" },
  { id: 23, order_route: 19, name: "Tajna Drukarnia Podziemna", era: "II WOJNA ŚWIATOWA", type: "OBIEKT HISTORYCZNY / ARCHITEKTURA", coords: [22.60510, 51.45990], addr: "Kościuszki", desc: "Ośrodek wydawniczy wolnego słowa, drukujący komunikaty radiowe z nasłuchu alianckiego.", audio: "audio_tajna_drukarnia.mp3" },
  { id: 24, order_route: 20, name: "Pałac Sanguszków — Punkt Strategiczny", era: "II WOJNA ŚWIATOWA", type: "OBIEKT HISTORYCZNY / ARCHITEKTURA", coords: [22.60150, 51.46650], addr: "Park Miejski", desc: "Świadek walk w lipcu 1944 roku w trakcie realizacji założeń Akcji „Burza”.", audio: "audio_palac_sanguszkow.mp3" },
  { id: 25, order_route: 21, name: "Krzyż Wolności", era: "POWSTANIA", type: "MIEJSCE PAMIĘCI / POMNIK", coords: [22.60250, 51.45880], addr: "ul. Lipowa / 3 Maja", desc: "Historyczny symbol niezłomności mieszkańców. Miejsce manifestacji w okresach braku suwerenności.", audio: "audio_krzyz_wolnosci.mp3" },
  { id: 26, order_route: 22, name: "Cmentarz Wojenny 1915-18", era: "I WOJNA / LEGIONY", type: "NEKROPOLIA / MOGIŁA", coords: [22.60155, 51.45865], addr: "ul. Lipowa (Cmentarz)", desc: "Miejsce spoczynku ok. 1000 żołnierzy różnych narodowości, w tym wielu Polaków.", audio: "audio_cmentarz_wojenny.mp3" },
  { id: 5, order_route: 23, name: "Kwatera Wrześniowa 1939", era: "II WOJNA ŚWIATOWA", type: "NEKROPOLIA / MOGIŁA", coords: [22.59690, 51.45660], addr: "Cmentarz Parafialny", desc: "Mogiła żołnierzy Wojska Polskiego poległych w obronie rejonu Lubartowa przed agresją niemiecką we wrześniu 1939 r.", audio: "audio_kwatera_wrzesniowa.mp3" },
  { id: 6, order_route: 24, name: "Nagrobek Legionistów", era: "I WOJNA / LEGIONY", type: "NEKROPOLIA / MOGIŁA", coords: [22.59710, 51.45640], addr: "Cmentarz Parafialny", desc: "Upamiętnienie żołnierzy Legionów Polskich poległych w 1915 roku w starciach o niepodległą Polskę.", audio: "audio_nagrobek_legionistow.mp3" },
  { id: 7, order_route: 25, name: "Pomnik Zwycięstwa 1920", era: "WOJNA 1920", type: "MIEJSCE PAMIĘCI / POMNIK", coords: [22.59730, 51.45620], addr: "Cmentarz Parafialny", desc: "Wzniesiony ku czci obrońców Ojczyzny przed najazdem bolszewickim. Tradycyjne miejsce obchodów patriotycznych.", audio: "audio_pomnik_1920.mp3" },
  { id: 8, order_route: 26, name: "Symboliczny Grób kpt. 'Uskoka'", era: "PODZIEMIE ANTYKOMUNISTYCZNE", type: "MIEJSCE PAMIĘCI / POMNIK", coords: [22.59750, 51.45680], addr: "Cmentarz Parafialny", desc: "Upamiętnienie kpt. Zdzisława Brońskiego (1912-1949), legendarnego dowódcy partyzanckiego AK-WiN na Ziemi Lubartowskiej.", audio: "audio_pomnik_uskoka.mp3" }
];

/* ======================================================================
   PUNKTY WYJAZDOWE — świadomie POZA docelową bazą 26, dojazd wymagany.
   Nie wchodzą w numerację order_route ani w trasę pieszą.
   ====================================================================== */
const wyprawy = [
  { name: "Skrobów — Obóz Specjalny NKWD nr 10", era: "PODZIEMIE ANTYKOMUNISTYCZNE", type: "MIEJSCE PAMIĘCI / POMNIK",
    coords: [22.56944, 51.43917],
    desc: "Po rozbrojeniu 27. WDP AK sowieckie władze utworzyły tu obóz dla żołnierzy AK, BCh i NSZ. 27 marca 1945 r. więźniowie dokonali brawurowej ucieczki." },
  { name: "Bunkier w Dąbrówce — miejsce śmierci „Uskoka”", era: "PODZIEMIE ANTYKOMUNISTYCZNE", type: "MIEJSCE PAMIĘCI / POMNIK",
    coords: [22.51861, 51.40111],
    desc: "21 maja 1949 r., osaczony przez UB-KBW, kpt. Zdzisław Broński „Uskok” zdetonował granat, wybierając śmierć zamiast pojmania." },
  { name: "Lasy Kozłowieckie", era: "PODZIEMIE ANTYKOMUNISTYCZNE", type: "OBIEKT HISTORYCZNY / ARCHITEKTURA",
    coords: [22.52917, 51.41750],
    desc: "Główne zgrupowanie partyzanckie 27. WDP AK — kwatera dowodzenia przed wyzwoleniem Lubartowa." },
  { name: "Piaski — miejsce śmierci „Wiktora”", era: "PODZIEMIE ANTYKOMUNISTYCZNE", type: "MIEJSCE PAMIĘCI / POMNIK",
    coords: [22.8667, 51.1667],
    desc: "Ppor. Stanisław Kuchciewicz „Wiktor” zginął 10 lutego 1953 r. podczas akcji na Gminną Kasę Spółdzielczą — ostatni dowódca oddziału po śmierci „Uskoka”." }
];

let map;
let markerObjects = [];

// Token wbudowany na sztywno — działa od razu, bez potrzeby wpisywania go ręcznie.
// Jeśli kiedyś przestanie działać (limit/wygaśnięcie), #tokenGate pokaże się
// automatycznie jako fallback (patrz initMap()).
const DEFAULT_TOKEN = 'pk.eyJ1Ijoic3psYWtwYW1pZWNpIiwiYSI6ImNtcG9mbnc2NzAyejMycXF3YzBmejUxaWgifQ.IzEorkORB8T0RbT6N-WCLg';

function initMap(token) {
  mapboxgl.accessToken = token;

  map = new mapboxgl.Map({
    container: 'map',
    style: 'mapbox://styles/mapbox/dark-v11',
    center: [22.605, 51.4605],
    zoom: 13.5,
    pitch: 15
  });

  map.on('error', (e) => {
    console.error('Błąd Mapbox (prawdopodobnie zły/wygasły token):', e);
    document.getElementById('tokenGate').classList.add('visible');
  });

  map.on('load', () => {
    points.forEach(p => addMarker(p, false));
    wyprawy.forEach(p => addMarker(p, true));
    buildPanel();
    buildLegend();
    drawNarrativeRoute();
  });
}

function startMapWithInputToken() {
  const val = document.getElementById('tokenInput').value.trim();
  if (!val) return;
  document.getElementById('tokenGate').classList.remove('visible');
  initMap(val);
}

function addMarker(p, isWyprawa) {
  const el = document.createElement('div');
  const shape = TYPES[p.type] ? TYPES[p.type].shape : 'round';
  el.className = `marker shape-${shape}`;
  el.style.background = ERAS[p.era] ? ERAS[p.era].color : '#888';
  el.dataset.era = p.era;
  el.dataset.type = p.type;

  const numberSpan = document.createElement('span');
  numberSpan.className = 'marker-number';
  numberSpan.innerText = isWyprawa ? '🚗' : (p.order_route || '');
  el.appendChild(numberSpan);

  const distanceNote = isWyprawa
    ? `<div class="audio">📍 Poza trasą pieszą — wymaga dojazdu</div>` : '';
  const audioLine = p.audio ? `<div class="audio">🔊 ${p.audio}</div>` : '';

  const popup = new mapboxgl.Popup({ offset: 14 }).setHTML(`
    <span class="meta">${p.era} · ${p.type}</span>
    <h3>${p.name}</h3>
    ${p.addr ? `<p style="font-size:11px; color:#8a7a5c; margin:0 0 6px 0;">📍 ${p.addr}</p>` : ''}
    <p>${p.desc}</p>
    ${audioLine}
    ${distanceNote}
  `);

  const marker = new mapboxgl.Marker(el).setLngLat(p.coords).setPopup(popup).addTo(map);
  markerObjects.push({ marker, era: p.era, type: p.type, el });
}

function buildPanel() {
  const panel = document.createElement('div');
  panel.id = 'panel';
  panel.innerHTML = `
    <h1>Lubartowski Szlak Pamięci</h1>
    <p><span class="count">${points.length}</span> punktów docelowych w mieście + <span class="count">${wyprawy.length}</span> wyjazdowe.</p>
    <p><a href="https://szlakpamieci.netlify.app/" target="_blank">🏰 Bastion Pamięci — pełne archiwum →</a></p>
  `;
  document.body.appendChild(panel);
}

function buildLegend() {
  const legend = document.createElement('div');
  legend.id = 'legend';
  let html = `<div class="legend-group-title">Era</div>`;
  Object.entries(ERAS).forEach(([key, val]) => {
    html += `
      <label>
        <input type="checkbox" checked onchange="applyFilters()" data-filter="era" value="${key}">
        <span class="swatch round" style="background:${val.color}"></span>
        ${key}
      </label>`;
  });
  html += `<div class="legend-group-title">Typ obiektu</div>`;
  Object.entries(TYPES).forEach(([key, val]) => {
    html += `
      <label>
        <input type="checkbox" checked onchange="applyFilters()" data-filter="type" value="${key}">
        <span class="swatch ${val.shape}" style="background:#999"></span>
        ${key}
      </label>`;
  });
  legend.innerHTML = html;
  document.body.appendChild(legend);
}

function applyFilters() {
  const eraChecked = [...document.querySelectorAll('input[data-filter="era"]:checked')].map(i => i.value);
  const typeChecked = [...document.querySelectorAll('input[data-filter="type"]:checked')].map(i => i.value);
  markerObjects.forEach(m => {
    const visible = eraChecked.includes(m.era) && typeChecked.includes(m.type);
    m.el.style.display = visible ? 'flex' : 'none';
  });
}

/* ======================================================================
   RYSOWANIE ŻÓŁTEJ LINII — sortowanie po order_route (nie po id!),
   żeby trasa nie gubiła ciągłości i przechodziła logiczną pętlą po mieście.
   ====================================================================== */
async function drawNarrativeRoute() {
  const ordered = [...points].sort((a, b) => a.order_route - b.order_route);
  const coords = ordered.map(p => p.coords);

  try {
    // Directions API: max 25 współrzędnych/zapytanie — 26 punktów dzielimy
    // na dwa zachodzące na siebie odcinki i sklejamy geometrię w jedną linię.
    const chunk1 = coords.slice(0, 25);
    const chunk2 = coords.slice(24);
    const [geo1, geo2] = await Promise.all([fetchRouteChunk(chunk1), fetchRouteChunk(chunk2)]);

    let mergedCoords, totalDistance = 0, totalDuration = 0;
    if (geo1 || geo2) {
      mergedCoords = [
        ...(geo1 ? geo1.geometry.coordinates : []),
        ...(geo2 ? geo2.geometry.coordinates.slice(1) : [])
      ];
      totalDistance = (geo1 ? geo1.distance : 0) + (geo2 ? geo2.distance : 0);
      totalDuration = (geo1 ? geo1.duration : 0) + (geo2 ? geo2.duration : 0);
    } else {
      // Fallback: jeśli Directions API zawiedzie, rysujemy linię prostą po order_route,
      // żeby trasa nigdy nie "znikała" całkowicie.
      console.warn('Directions API niedostępne — rysuję linię prostą wg order_route.');
      mergedCoords = coords;
    }

    const geojson = { type: 'Feature', geometry: { type: 'LineString', coordinates: mergedCoords } };
    map.addSource('route', { type: 'geojson', data: geojson });
    map.addLayer({
      id: 'route-casing', type: 'line', source: 'route',
      layout: { 'line-cap': 'round', 'line-join': 'round' },
      paint: { 'line-color': '#14120f', 'line-width': 6, 'line-opacity': 0.6 }
    });
    map.addLayer({
      id: 'route-line', type: 'line', source: 'route',
      layout: { 'line-cap': 'round', 'line-join': 'round' },
      paint: { 'line-color': '#d8b878', 'line-width': 3, 'line-dasharray': [0.2, 1.6] }
    });

    const info = document.createElement('div');
    info.id = 'routeInfo';
    if (totalDistance > 0) {
      const km = (totalDistance / 1000).toFixed(1);
      const min = Math.round(totalDuration / 60);
      info.innerHTML = `🚶 Trasa piesza (26 pkt, tryb narracyjny): <strong>${km} km</strong> · ok. <strong>${min} min</strong>`;
    } else {
      info.innerHTML = `🚶 Trasa piesza (26 pkt) — linia orientacyjna, Directions API niedostępne.`;
    }
    document.body.appendChild(info);

  } catch (err) {
    console.error('Błąd rysowania trasy:', err);
  }
}

async function fetchRouteChunk(coordsArray) {
  if (coordsArray.length < 2) return null;
  const coordsStr = coordsArray.map(c => c.join(',')).join(';');
  const url = `https://api.mapbox.com/directions/v5/mapbox/walking/${coordsStr}` +
    `?geometries=geojson&overview=full&access_token=${mapboxgl.accessToken}`;
  const res = await fetch(url);
  const data = await res.json();
  if (!data.routes || !data.routes.length) return null;
  return data.routes[0];
}

// Start mapy z wbudowanym tokenem. Jeśli token zawiedzie, map.on('error', ...)
// powyżej automatycznie pokaże panel do wpisania własnego tokenu.
initMap(DEFAULT_TOKEN);
</script>
