backend:
  name: git-gateway
  repo: bbandura091-lab/szlak--pamieci-karty
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/d304ccc3-7e0f-4e70-beb7-f7a7de8a3e48/pkce
  auth_token_endpoint: /sites/d304ccc3-7e0f-4e70-beb7-f7a7de8a3e48/token
  gateway_url: https://gateway.decapbridge.com

  # Zobacz kto co zrobił (opcjonalne)
  commit_messages:
    create: Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

logo_url: https://decapbridge.com/decapcms-with-bridge.svg
site_url: https://bbandura091-lab.github.io

media_folder: "images"
public_folder: "images"

collections:
  - name: "nekropolia"
    label: "Nekropolia"
    folder: "content/nekropolia"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Imię i Nazwisko / Postać", name: "title", widget: "string"}
      - {label: "Rola / Stopień", name: "subtitle", widget: "string"}
      - {label: "Cmentarz / Lokacja", name: "badge", widget: "string"}
      - {label: "Zdjęcie", name: "image", widget: "image", required: false}
      - {label: "Opis biograficzny", name: "body", widget: "markdown"}

  - name: "miejsca"
    label: "Miejsca Pamięci"
    folder: "content/miejsca"
    create: true
    slug: "{{fields.numer_punktu}}-{{slug}}"
    fields:
      - {label: "Numer punktu (kolejność na trasie)", name: "numer_punktu", widget: "number", value_type: "int", required: false}
      - {label: "Nazwa Miejsca", name: "title", widget: "string"}
      - label: "Epoka historyczna"
        name: "era"
        widget: "select"
        options:
          - "POWSTANIE STYCZNIOWE"
          - "WOJNA 1920"
          - "II WOJNA ŚWIATOWA"
          - "OKRES POWOJENNY"
      - label: "Typ obiektu"
        name: "typ"
        widget: "select"
        options:
          - "OBIEKT HISTORYCZNY / ARCHITEKTURA"
          - "MIEJSCE PAMIĘCI / POMNIK"
          - "NEKROPOLIA / MOGIŁA"
      - {label: "Typ szczegółowy (opis dla popupu)", name: "typ_szczegolowy", widget: "string", required: false}
      - {label: "Adres / Lokalizacja", name: "badge", widget: "string"}
      - {label: "Szerokość geogr. (lat)", name: "lat", widget: "number", value_type: "float", required: false}
      - {label: "Długość geogr. (lng)", name: "lng", widget: "number", value_type: "float", required: false}
      - {label: "Zdjęcie", name: "image", widget: "image", required: false}
      - {label: "Plik audio (nazwa)", name: "audio", widget: "string", required: false}
      - {label: "Opis historyczny", name: "body", widget: "markdown"}
