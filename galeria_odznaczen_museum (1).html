<style>
  .odznaczenia-section {
    width: 100%;
    padding: 48px 24px;
    background: #f5f0e8;
    text-align: center;
    font-family: Georgia, 'Times New Roman', serif;
    box-sizing: border-box;
  }
  @media (prefers-color-scheme: dark) {
    .odznaczenia-section { background: #1a1614; }
    .odznaczenia-section h2 { color: #e8c9a0 !important; }
    .odznaczenia-section .odznaczenia-lead { color: #b8aa9a !important; }
  }
  .odznaczenia-grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 28px;
    max-width: 900px;
    margin: 0 auto;
  }
  .odznaka-card {
    width: 220px;
    padding: 28px 20px 20px 20px;
    background: linear-gradient(160deg, #2a2320 0%, #1c1715 100%);
    border: 1px solid #4a3a2e;
    border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.04);
    box-sizing: border-box;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }
  .odznaka-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 32px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.06);
  }
  .odznaka-card img {
    width: 100%;
    height: auto;
    max-height: 180px;
    object-fit: contain;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));
  }
  .odznaka-caption {
    margin-top: 16px;
    font-size: 13px;
    color: #c9b8a0;
    font-style: italic;
    letter-spacing: 0.3px;
    border-top: 1px solid #4a3a2e;
    padding-top: 12px;
  }
</style>
