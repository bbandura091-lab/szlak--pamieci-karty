<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Szlak Pamięci – Lubartów</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <!-- Biblioteka Mapbox GL JS -->
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.css" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.js"></script>
    
    <style>
        * { box-sizing: border-box; }
        html, body { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            font-family: 'Georgia', 'Times New Roman', serif; 
            background: #14120f; 
            color: #eee; 
        }

        /* Bramka tokenu / Ekran startowy */
        #tokenGate { 
            position: fixed; 
            inset: 0; 
            z-index: 100; 
            background: #14120f; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            flex-direction: column;
            padding: 20px;
            text-align: center;
        }
        #tokenGate h1 { font-size: 22px; letter-spacing: 1px; margin: 0 0 10px 0; color: #d8b878; }
        #tokenGate p { max-width: 420px; font-size: 14px; color: #bbb; line-height: 1.5; margin: 0 0 15px 0; }
        #tokenGate input { 
            width: 320px; 
            max-width: 80vw; 
            padding: 10px 12px; 
            border-radius: 6px; 
            border: 1px solid #555; 
            background: #221f1a; 
            color: #fff;
            margin-bottom: 12px;
        }
        #tokenGate button { 
            padding: 10px 22px; 
            border: none; 
            border-radius: 6px; 
            background: #b08d57; 
            color: #fff; 
            font-size: 14px; 
            cursor: pointer; 
        }
        #tokenGate button:hover { background: #c49e68; }

        /* Pojemnik na mapę */
        #map { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100vh; 
            z-index: 1; 
        }
    </style>
</head>
<body>

    <!-- Ekran startowy z prośbą o token (jeśli wymagany) -->
    <div id="tokenGate">
        <h1>Szlak Pamięci Lubartów</h1>
        <p>Wprowadź swój publiczny klucz (token) Mapbox, aby uruchomić interaktywną mapę szlaku.</p>
        <input type="text" id="mapboxTokenInput" placeholder="pk.eyJ1I..." />
        <button onclick="startMap()">Uruchom mapę</button>
    </div>

    <!-- Główna kontener mapy -->
    <div id="map"></div>

    <script>
        function startMap() {
            const tokenInput = document.getElementById('mapboxTokenInput').value.trim();
            if (!tokenInput) {
                alert('Proszę wprowadzić prawidłowy token Mapbox.');
                return;
            }

            mapboxgl.accessToken = tokenInput;

            // Ukryj ekran podawania tokenu
            document.getElementById('tokenGate').style.display = 'none';

            // Inicjalizacja mapy z widokiem na Lubartów
            const map = new mapboxgl.Map({
                container: 'map',
                style: 'mapbox://styles/mapbox/dark-v11', // Ciemny styl mapy pasujący do szlaku
                center: [22.6072, 51.4619], // Współrzędne Lubartowa (długość, szerokość)
                zoom: 14
            });

            // Dodanie nawigacji (przybliżanie / oddalanie)
            map.addControl(new mapboxgl.NavigationControl());
        }
    </script>
</body>
</html>
