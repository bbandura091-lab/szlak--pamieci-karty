<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Szlak Pamięci – Lubartów</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="0; url=mapa.html">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: 'Georgia', 'Times New Roman', serif;
    background: #14120f; color: #eee;
    display: flex; align-items: center; justify-content: center;
  }
  .redirect-box { text-align: center; padding: 20px; }
  h1 { font-size: 20px; color: #d8b878; margin: 0 0 10px 0; letter-spacing: 0.5px; }
  p { font-size: 13px; color: #999; margin: 0 0 16px 0; }
  a { color: #d8b878; font-size: 13px; }
  .spinner {
    width: 28px; height: 28px; margin: 0 auto 16px auto;
    border: 3px solid #333; border-top-color: #b08d57;
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
<script>
  // Przekierowanie JS jako zapasowe, na wypadek gdyby meta-refresh
  // zostało zablokowane przez przeglądarkę.
  window.location.replace('mapa.html');
</script>
</head>
<body>
  <div class="redirect-box">
    <div class="spinner"></div>
    <h1>Szlak Pamięci Lubartów</h1>
    <p>Przekierowuję do mapy…</p>
    <a href="mapa.html">Kliknij tutaj, jeśli nie nastąpiło automatyczne przekierowanie</a>
  </div>
</body>
</html>
