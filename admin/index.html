<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel — Lubartowski Szlak Pamięci</title>
</head>
<body>
  <script>
    // Automatyczne czyszczenie nieaktualnych Service Workerów i pamięci cache
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        registrations.forEach(function(registration) {
          var url = (registration.active && registration.active.scriptURL) || '';
          if (!url.endsWith('/sw.js')) {
            registration.unregister();
            if ('caches' in window) {
              caches.keys().then(function(names) {
                names.forEach(function(name) {
                  caches.delete(name);
                });
              });
            }
          }
        });
      });
    }
  </script>

  <!-- Najnowsza, stabilna wersja Decap CMS v3 -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</body>
</html>
